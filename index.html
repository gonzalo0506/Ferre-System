<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferre System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1565c0;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 5px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.10);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 10px;
            color: #1565c0;
        }

        .card p {
            color: #666;
        }

        .menu {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.10);
        }

        .menu h2 {
            margin-bottom: 15px;
        }

        .menu button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #1565c0;
            color: white;
            cursor: pointer;
        }

        .menu button:hover {
            background: #0d47a1;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>🔧 FERRE SYSTEM</h1>
        <p>Sistema Administrativo para Ferretería</p>
    </header>

    <div class="container">

        <div class="dashboard">

            <div class="card">
                <h2>📦 Productos</h2>
                <p>Administrar inventario</p>
            </div>

            <div class="card">
                <h2>💰 Ventas</h2>
                <p>Registrar y consultar ventas</p>
            </div>

            <div class="card">
                <h2>👥 Clientes</h2>
                <p>Administrar clientes</p>
            </div>

            <div class="card">
                <h2>💵 Caja</h2>
                <p>Control de ingresos y egresos</p>
            </div>

        </div>

        <div class="menu">
            <h2>Menú principal</h2>

            <button>Productos</button>
            <button>Ventas</button>
            <button>Clientes</button>
            <button>Proveedores</button>
            <button>Inventario</button>
            <button>Reportes</button>
        </div>

    </div>

    <footer>
        Ferre System © 2026
    </footer>

</body>
</html>
