<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FERRE-SYSTEM</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f7;
            color: #17202a;
        }

        header {
            background: #123456;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 5px;
            opacity: 0.8;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .dashboard {
            max-width: 1000px;
            margin: auto;
            padding: 0 20px 30px;
        }

        .dashboard h2 {
            margin-bottom: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        .stat span {
            color: #777;
        }

        .stat strong {
            display: block;
            font-size: 25px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>🔧 FERRE-SYSTEM</h1>
    <p>Administración inteligente para ferreterías</p>
</header>

<section class="menu">

    <div class="card">
        <div class="icon">📦</div>
        <h3>Inventario</h3>
    </div>

    <div class="card">
        <div class="icon">🛒</div>
        <h3>Ventas</h3>
    </div>

    <div class="card">
        <div class="icon">💰</div>
        <h3>Caja</h3>
    </div>

    <div class="card">
        <div class="icon">💸</div>
        <h3>Gastos</h3>
    </div>

    <div class="card">
        <div class="icon">🔑</div>
        <h3>Llaves</h3>
    </div>

    <div class="card">
        <div class="icon">🚚</div>
        <h3>Proveedores</h3>
    </div>

    <div class="card">
        <div class="icon">👥</div>
        <h3>Clientes</h3>
    </div>

    <div class="card">
        <div class="icon">📊</div>
        <h3>Reportes</h3>
    </div>

</section>

<section class="dashboard">

    <h2>📊 Resumen del día</h2>

    <div class="stats">

        <div class="stat">
            <span>Ventas</span>
            <strong>$0.00</strong>
        </div>

        <div class="stat">
            <span>Gastos</span>
            <strong>$0.00</strong>
        </div>

        <div class="stat">
            <span>Ganancia</span>
            <strong>$0.00</strong>
        </div>

        <div class="stat">
            <span>Productos vendidos</span>
            <strong>0</strong>
        </div>

    </div>

</section>

</body>
</html>
